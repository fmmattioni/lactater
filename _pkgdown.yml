reference:
- title: Analyze a test
  desc: >
    Start here. `lactate_threshold()` takes the stages of a step test (intensity, lactate and, optionally,
    heart rate) and estimates every threshold method in one call. It returns a tibble that remembers the
    data and the fitted curve, so it can be plotted, checked and turned into zones afterwards.
  contents:
  - lactate_threshold
  - demo_data
  - lactate_tests
  - lactate_curve
- title: Look at the results
  desc: >
    `autoplot()` draws an overview of every threshold on one intensity axis, or a single method in detail.
    `test_report()` writes a report of the test as one web page (and PDF) for the athlete or the coach;
    `report_start()` builds one step by step. `lactate_report()` formats the results as a table for papers. `theme_lactater()` gives your
    own plots the same look.
  contents:
  - autoplot.lactate_thresholds
  - test_report
  - report_start
  - lactate_report
  - gt_lactater
  - plot_methods
  - theme_lactater
- title: Check the analysis
  desc: >
    A threshold is only as good as the test behind it. `lactate_checks()` flags what is easy to miss in a
    table of numbers, `lactate_fit_quality()` shows how well each curve follows and predicts the measured lactate,
    and `lactate_diagnostics()` plots the regression checks and how much each threshold rests on single stages.
  contents:
  - lactate_checks
  - lactate_fit_quality
  - lactate_diagnostics
- title: Use the results
  desc: >
    Turn two thresholds of your choice into training zones and count the training time in them; compare two tests
    of one athlete (is the change real, how far did the curve move, did it shift or change shape), follow a series
    of tests, measure the test-retest noise of your own protocol, compare athletes per kg or % of peak or with the population of their age and sex, and predict race
    performance, from published equations or one you calibrate on your own athletes.
  contents:
  - lactate_zones
  - training_load
  - compare_tests
  - lactate_reliability
  - curve_shift
  - curve_shape
  - predict_performance
  - calibrate_performance
  - lactate_trend
  - relative_thresholds
  - reference_percentiles
- title: Beyond the step test
  desc: >
    The maximal lactate steady state from constant-load bouts, to check which threshold estimates it in your
    athletes, and the maximal lactate accumulation rate from a sprint test.
  contents:
  - lactate_mlss
  - vlamax
- title: Record a test
  desc: >
    A web form that records a test and downloads it for lactater, with a printable sheet and a CSV template, to
    record every test the same way.
  contents:
  - recording_sheet
  - read_recording
- title: Re-exported functions
  contents:
  - reexports
