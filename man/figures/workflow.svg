<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ef5a7a"/>
      <stop offset="0.5" stop-color="#a46ad8"/>
      <stop offset="1" stop-color="#33c3f0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#fcfcfb"/>
  <rect x="0" y="0" width="960" height="5" rx="2" fill="url(#brand)"/>

  <!-- input -->
  <rect x="30" y="100" width="190" height="100" rx="10" fill="#ffffff" stroke="#d9d8d3"/>
  <text x="125" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Step test</text>
  <text x="125" y="160" text-anchor="middle" font-size="12.5" fill="#52514e">intensity, lactate,</text>
  <text x="125" y="178" text-anchor="middle" font-size="12.5" fill="#52514e">heart rate (optional)</text>

  <!-- core -->
  <line x1="220" y1="150" x2="278" y2="150" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="282" y="95" width="230" height="110" rx="10" fill="#183A53"/>
  <text x="397" y="137" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff" font-family="JetBrains Mono, Menlo, monospace">lactate_threshold()</text>
  <text x="397" y="162" text-anchor="middle" font-size="12.5" fill="#cde2fb">7 methods, 18 thresholds</text>
  <text x="397" y="180" text-anchor="middle" font-size="12.5" fill="#cde2fb">optional bootstrap CIs</text>

  <!-- outputs -->
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="13.5" font-weight="700" fill="#0b0b0b">
    <line x1="512" y1="150" x2="560" y2="45" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="512" y1="150" x2="560" y2="115" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="512" y1="150" x2="560" y2="185" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="512" y1="150" x2="560" y2="255" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="564" y="22" width="366" height="48" rx="9" fill="#ffffff" stroke="#d9d8d3"/>
    <circle cx="588" cy="46" r="7" fill="#e34948" stroke="#ffffff" stroke-width="2"/>
    <text x="604" y="51">autoplot()</text>
    <text x="712" y="51" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e">curve and every threshold</text>

    <rect x="564" y="92" width="366" height="48" rx="9" fill="#ffffff" stroke="#d9d8d3"/>
    <circle cx="588" cy="116" r="7" fill="#eda100" stroke="#ffffff" stroke-width="2"/>
    <text x="604" y="121">lactate_checks()</text>
    <text x="760" y="121" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e">what to double-check</text>

    <rect x="564" y="162" width="366" height="48" rx="9" fill="#ffffff" stroke="#d9d8d3"/>
    <circle cx="588" cy="186" r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
    <text x="604" y="191">lactate_zones()</text>
    <text x="752" y="191" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e">your LT1 and LT2</text>

    <rect x="564" y="232" width="366" height="48" rx="9" fill="#ffffff" stroke="#d9d8d3"/>
    <circle cx="588" cy="256" r="7" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
    <text x="604" y="261">lactate_report()</text>
    <text x="760" y="261" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e">a table for reports</text>
  </g>
</svg>
