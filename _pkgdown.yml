      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-RB9C24aIDFzjUhqFRTXhQ.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>
  light-switch: true
  bslib:
    primary: "#183A53"
    link-color: "#1F5FA8"
    base_font: {google: "IBM Plex Sans"}
    heading_font: {google: "IBM Plex Sans"}
    code_font: {google: "IBM Plex Mono"}
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: man/figures/header.png
      alt: "Tools for Analyzing Lactate Thresholds"
    twitter:
      creator: "@felipe_mattioni"
      card: summary_large_image

